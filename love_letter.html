<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ff6b9d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>马钰涵 💕</title>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700&family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary-color: #ff6b9d;
            --secondary-color: #ff8fab;
            --accent-color: #ffd1dc;
            --text-color: #d63384;
            --glow-color: rgba(255, 107, 157, 0.6);
            --bg-dark: #0d0d1a;
            --bg-gradient-start: #1a1a2e;
            --bg-gradient-end: #16213e;
        }

        html, body {
            height: 100%;
            overflow-x: hidden;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(180deg, var(--bg-gradient-start) 0%, #16213e 30%, #0f3460 60%, #533483 100%);
            background-size: 400% 400%;
            animation: gradientShift 25s ease infinite;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-y: auto;
            font-family: 'Noto Serif SC', serif;
            position: relative;
            padding-bottom: 40px;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 0%; }
            25% { background-position: 50% 25%; }
            50% { background-position: 100% 50%; }
            75% { background-position: 50% 75%; }
            100% { background-position: 0% 0%; }
        }

        .stars-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 2.5s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.4); }
            50% { opacity: 1; transform: scale(1); }
        }

        .aurora {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(ellipse at 30% 70%, rgba(255, 107, 157, 0.12) 0%, transparent 35%),
                radial-gradient(ellipse at 70% 20%, rgba(118, 75, 162, 0.12) 0%, transparent 35%),
                radial-gradient(ellipse at 50% 50%, rgba(240, 147, 251, 0.08) 0%, transparent 30%),
                radial-gradient(ellipse at 20% 30%, rgba(255, 182, 193, 0.08) 0%, transparent 30%);
            animation: auroraMove 18s ease-in-out infinite;
            z-index: 1;
        }

        @keyframes auroraMove {
            0%, 100% { transform: translate(0, 0) rotate(0deg); opacity: 0.5; }
            25% { transform: translate(-3%, -3%) rotate(1deg); opacity: 0.7; }
            50% { transform: translate(-6%, 0) rotate(0deg); opacity: 0.5; }
            75% { transform: translate(-3%, 3%) rotate(-1deg); opacity: 0.7; }
        }

        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .floating-heart {
            position: absolute;
            font-size: 1.2rem;
            animation: floatUpMobile 10s ease-in-out infinite;
            opacity: 0.5;
        }

        @keyframes floatUpMobile {
            0% { transform: translateY(100vh) rotate(0deg) scale(0.4); opacity: 0; }
            15% { opacity: 0.7; }
            85% { opacity: 0.7; }
            100% { transform: translateY(-150px) rotate(720deg) scale(0.8); opacity: 0; }
        }

        .balloon {
            position: fixed;
            font-size: 2rem;
            animation: balloonFloatMobile 14s ease-in-out infinite;
            z-index: 3;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        @keyframes balloonFloatMobile {
            0%, 100% { transform: translateY(0) translateX(0) rotate(-3deg); }
            25% { transform: translateY(-20px) translateX(10px) rotate(0deg); }
            50% { transform: translateY(-35px) translateX(-8px) rotate(3deg); }
            75% { transform: translateY(-18px) translateX(-10px) rotate(0deg); }
        }

        .content-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            padding: 1.5rem 1rem;
            margin-top: 2rem;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 28px;
            padding: 2rem 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.05),
                0 0 50px rgba(255, 107, 157, 0.08);
        }

        .header-section {
            margin-bottom: 1.5rem;
        }

        .main-title {
            font-size: clamp(3.5rem, 20vw, 6rem);
            font-family: 'Ma Shan Zheng', cursive;
            background: linear-gradient(45deg, #ff6b9d, #ff8fab, #ffd1dc, #fff, #ffd1dc, #ff8fab, #ff6b9d);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: textGlow 3.5s ease-in-out infinite, fadeInScale 1.2s ease-out;
            text-shadow: 0 0 40px rgba(255, 107, 157, 0.3);
            margin-bottom: 0.3rem;
            letter-spacing: 0.08em;
            line-height: 1;
        }

        @keyframes textGlow {
            0%, 100% { background-position: 0% 50%; filter: brightness(1); }
            50% { background-position: 100% 50%; filter: brightness(1.3); }
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.4); }
            to { opacity: 1; transform: scale(1); }
        }

        .subtitle {
            font-size: clamp(1.2rem, 7vw, 2rem);
            font-family: 'Ma Shan Zheng', cursive;
            color: white;
            text-shadow: 
                0 0 15px rgba(255, 255, 255, 0.7),
                0 0 30px rgba(255, 107, 157, 0.5);
            animation: fadeInUp 1.2s ease-out 0.3s both, pulse 1.8s ease-in-out infinite;
            margin-bottom: 1.5rem;
            letter-spacing: 0.15em;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .name-container {
            position: relative;
            display: inline-block;
            margin: 1.5rem 0;
            animation: fadeInUp 1.2s ease-out 0.5s both;
        }

        .name-text {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: clamp(2.5rem, 18vw, 5rem);
            background: linear-gradient(135deg, #ff6b9d, #ff8fab, #ffd1dc, #ff6b9d, #ff8fab);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: nameHeartbeat 1s ease-in-out infinite, textGlow 3.5s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(255, 107, 157, 0.5);
            letter-spacing: 0.08em;
            position: relative;
            z-index: 10;
        }

        .photo-section {
            margin: 1.5rem 0;
            animation: fadeInUp 1.2s ease-out 0.7s both;
        }

        .photo-container {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 0 auto;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid rgba(255, 107, 157, 0.6);
            box-shadow: 
                0 0 30px rgba(255, 107, 157, 0.4),
                inset 0 0 20px rgba(255, 255, 255, 0.1);
            animation: photoGlow 3s ease-in-out infinite;
        }

        @keyframes photoGlow {
            0%, 100% { box-shadow: 0 0 30px rgba(255, 107, 157, 0.4), inset 0 0 20px rgba(255, 255, 255, 0.1); }
            50% { box-shadow: 0 0 50px rgba(255, 107, 157, 0.6), inset 0 0 30px rgba(255, 255, 255, 0.15); }
        }

        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-frame {
            position: absolute;
            top: -8px;
            left: -8px;
            right: -8px;
            bottom: -8px;
            border: 2px solid rgba(255, 209, 220, 0.3);
            border-radius: 50%;
            animation: frameRotate 20s linear infinite;
        }

        @keyframes frameRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .photo-decoration {
            position: absolute;
            font-size: 1.5rem;
            animation: decorationFloat 2s ease-in-out infinite;
        }

        .photo-decoration.top-left {
            top: -15px;
            left: -15px;
            animation-delay: 0s;
        }

        .photo-decoration.top-right {
            top: -15px;
            right: -15px;
            animation-delay: 0.5s;
        }

        .photo-decoration.bottom-left {
            bottom: -15px;
            left: -15px;
            animation-delay: 1s;
        }

        .photo-decoration.bottom-right {
            bottom: -15px;
            right: -15px;
            animation-delay: 1.5s;
        }

        @keyframes decorationFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-5px) rotate(10deg); }
        }

        @keyframes nameHeartbeat {
            0%, 100% { transform: scale(1); }
            12% { transform: scale(1.06); }
            24% { transform: scale(1); }
            36% { transform: scale(1.05); }
            48% { transform: scale(1); }
        }

        .glow-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            animation: ripple 2.2s ease-out infinite;
            pointer-events: none;
        }

        .glow-ring:nth-child(1) {
            width: clamp(200px, 70vw, 280px);
            height: clamp(100px, 35vw, 140px);
            border: 2px solid rgba(255, 107, 157, 0.4);
        }

        .glow-ring:nth-child(2) {
            width: clamp(240px, 80vw, 330px);
            height: clamp(120px, 40vw, 165px);
            border: 2px solid rgba(255, 143, 171, 0.3);
            animation-delay: 0.4s;
        }

        .glow-ring:nth-child(3) {
            width: clamp(280px, 90vw, 380px);
            height: clamp(140px, 45vw, 190px);
            border: 2px solid rgba(255, 209, 220, 0.2);
            animation-delay: 0.8s;
        }

        .lyrics-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
            overflow: hidden;
        }

        .lyric-item {
            position: absolute;
            font-family: 'Ma Shan Zheng', cursive;
            font-size: clamp(1rem, 4.5vw, 1.5rem);
            color: rgba(255, 107, 157, 0.9);
            text-shadow: 0 0 20px rgba(255, 107, 157, 0.6), 0 0 40px rgba(255, 143, 171, 0.4);
            white-space: nowrap;
            animation: lyricFloat 8s ease-in-out forwards;
            opacity: 0;
        }

        @keyframes lyricFloat {
            0% {
                opacity: 0;
                transform: translateX(100vw) translateY(0);
            }
            10% {
                opacity: 1;
            }
            80% {
                opacity: 1;
            }
            90% {
                opacity: 0.5;
            }
            100% {
                opacity: 0;
                transform: translateX(-100%) translateY(0);
            }
        }

        .lyric-item.top { top: 15%; }
        .lyric-item.middle { top: 45%; }
        .lyric-item.bottom { top: 75%; }

        @keyframes ripple {
            0% { transform: translate(-50%, -50%) scale(0.7); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
        }

        .decorative-line {
            width: 180px;
            height: 3px;
            background: linear-gradient(90deg, transparent, rgba(255,107,157,0.7), rgba(255,209,220,0.5), rgba(255,107,157,0.7), transparent);
            margin: 2rem auto;
            animation: fadeInUp 1.2s ease-out 0.8s both;
            position: relative;
            border-radius: 2px;
        }

        .decorative-line::before,
        .decorative-line::after {
            content: '💕';
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.4rem;
            animation: bounce 0.8s ease-in-out infinite;
        }

        .decorative-line::before { left: -28px; animation-delay: 0s; }
        .decorative-line::after { right: -28px; animation-delay: 0.25s; }

        @keyframes bounce {
            0%, 100% { transform: translateY(-50%) scale(1); }
            50% { transform: translateY(-58%) scale(1.15); }
        }

        .love-message {
            font-size: clamp(0.95rem, 4vw, 1.1rem);
            color: rgba(255, 255, 255, 0.85);
            line-height: 2.2;
            margin: 1.5rem 0;
            animation: fadeInUp 1.2s ease-out 0.7s both;
            text-shadow: 0 1px 10px rgba(0, 0, 0, 0.3);
            max-width: 100%;
            padding: 0 0.5rem;
        }

        .love-message .intro {
            font-size: clamp(1.1rem, 5vw, 1.3rem);
            color: #ffd1dc;
            font-weight: bold;
            margin-bottom: 1.5rem;
            text-align: center;
            display: block;
            text-shadow: 0 0 15px rgba(255, 107, 157, 0.4);
        }

        .love-message .content {
            margin: 1.2rem 0;
            opacity: 0;
            animation: fadeInUp 0.7s ease-out forwards;
            background: linear-gradient(90deg, transparent, rgba(255,107,157,0.08), transparent);
            padding: 0.8rem 1rem;
            border-radius: 12px;
            border-left: 3px solid rgba(255, 107, 157, 0.4);
        }

        .love-message .content:nth-child(2) { animation-delay: 1s; }
        .love-message .content:nth-child(3) { animation-delay: 1.3s; }
        .love-message .content:nth-child(4) { animation-delay: 1.6s; }

        .love-message .signature {
            margin-top: 2.5rem;
            text-align: right;
            font-family: 'Ma Shan Zheng', cursive;
            font-size: clamp(1.2rem, 5vw, 1.6rem);
            color: #ffd1dc;
            opacity: 0;
            animation: fadeInUp 0.8s ease-out 2s forwards, pulse 2.5s ease-in-out infinite 2s;
            text-shadow: 0 0 15px rgba(255, 107, 157, 0.4);
        }

        .music-section {
            margin: 2.5rem 0;
            text-align: center;
            animation: fadeInUp 1.2s ease-out 2.2s both;
        }

        .music-label {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: clamp(1rem, 4vw, 1.3rem);
            color: #ffd1dc;
            margin-bottom: 1.2rem;
            text-shadow: 0 0 12px rgba(255, 107, 157, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }

        .music-player {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            background: rgba(255, 107, 157, 0.08);
            padding: 0.8rem 1.5rem;
            border-radius: 40px;
            border: 1px solid rgba(255, 107, 157, 0.2);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3), 0 0 30px rgba(255, 107, 157, 0.1);
            transition: all 0.3s ease;
        }

        .music-player:active { transform: scale(0.97); }

        .play-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b9d, #ff8fab);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 18px rgba(255, 107, 157, 0.5);
        }

        .play-btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 25px rgba(255, 107, 157, 0.7);
        }

        .play-btn i {
            color: white;
            font-size: 17px;
            margin-left: 3px;
        }

        .song-info { text-align: left; }

        .song-title {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 1rem;
            color: white;
        }

        .song-artist {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .progress-bar {
            width: 100px;
            height: 3px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 0.4rem;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff6b9d, #ffd1dc);
            border-radius: 2px;
            animation: progress 180s linear infinite;
        }

        @keyframes progress {
            from { width: 0%; }
            to { width: 100%; }
        }

        .footer-text {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(1.2rem, 5vw, 1.6rem);
            color: white;
            margin-top: 2.5rem;
            animation: fadeInUp 1.2s ease-out 2.5s both, twinkle 1.8s ease-in-out infinite;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.7), 0 0 40px rgba(255, 107, 157, 0.4);
        }

        @keyframes twinkle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .click-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            pointer-events: none;
        }

        .click-heart {
            position: absolute;
            font-size: 1.2rem;
            animation: clickFloatMobile 0.9s ease-out forwards;
            pointer-events: none;
        }

        @keyframes clickFloatMobile {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-80px) scale(0.3); }
        }

        .interactive-section {
            margin-top: 1.5rem;
            animation: fadeInUp 1.2s ease-out 2.7s both;
        }

        .countdown-container {
            display: flex;
            justify-content: center;
            gap: 0.6rem;
            margin-bottom: 1.5rem;
        }

        .countdown-item {
            background: rgba(255, 107, 157, 0.12);
            border: 1px solid rgba(255, 107, 157, 0.25);
            border-radius: 12px;
            padding: 1rem 1rem;
            min-width: 55px;
            text-align: center;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .countdown-item:active {
            transform: scale(0.95);
            background: rgba(255, 107, 157, 0.2);
        }

        .countdown-number {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 1.5rem;
            color: #ffd1dc;
            text-shadow: 0 0 12px rgba(255, 107, 157, 0.5);
        }

        .countdown-label {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 0.2rem;
        }

        .like-button {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: linear-gradient(135deg, rgba(255, 107, 157, 0.85), rgba(255, 143, 171, 0.85));
            border: none;
            border-radius: 40px;
            padding: 0.9rem 2rem;
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 1.1rem;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(255, 107, 157, 0.4);
        }

        .like-button:active {
            transform: scale(0.96);
            box-shadow: 0 6px 24px rgba(255, 107, 157, 0.5);
        }

        .like-button.liked {
            background: linear-gradient(135deg, #d63384, #ff6b9d);
        }

        .like-count { font-size: 1rem; }

        .cursor-heart {
            position: fixed;
            font-size: 1rem;
            pointer-events: none;
            z-index: 9999;
            animation: cursorFloatMobile 0.4s ease-out forwards;
        }

        .mobile-hint {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 0.8rem;
        }

        .touch-indicator {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 50;
        }

        .touch-dot {
            width: 8px;
            height: 8px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            animation: dotPulse 1.5s ease-in-out infinite;
        }

        .touch-dot:nth-child(2) { animation-delay: 0.3s; }
        .touch-dot:nth-child(3) { animation-delay: 0.6s; }

        @keyframes dotPulse {
            0%, 100% { transform: scale(1); opacity: 0.4; }
            50% { transform: scale(1.3); opacity: 0.8; }
        }

        .canvas-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        @media (min-width: 481px) {
            body { align-items: center; }
            .content-wrapper { margin-top: 0; }
            .container { padding: 2.5rem 2rem; }
            .main-title { font-size: clamp(4rem, 15vw, 7rem); }
            .subtitle { font-size: clamp(1.5rem, 6vw, 2.5rem); }
            .name-text { font-size: clamp(3rem, 14vw, 6rem); }
            .love-message { font-size: clamp(1rem, 3vw, 1.2rem); }
            .music-player { padding: 1rem 2rem; gap: 1rem; }
            .progress-bar { width: 130px; }
            .countdown-item { padding: 1.2rem 1.3rem; min-width: 70px; }
            .countdown-number { font-size: 1.8rem; }
            .like-button { padding: 1rem 2.5rem; font-size: 1.2rem; }
        }

        @media (min-width: 769px) {
            .content-wrapper { max-width: 600px; }
            .container { padding: 3rem 2.5rem; }
            .main-title { font-size: clamp(5rem, 12vw, 8rem); }
            .name-text { font-size: clamp(4rem, 10vw, 7rem); }
            .touch-indicator { display: none; }
        }
    </style>
</head>
<body>
    <div class="stars-bg" id="stars"></div>
    <div class="aurora"></div>
    <div class="floating-hearts" id="floatingHearts"></div>
    <div class="lyrics-container" id="lyricsContainer"></div>
    
    <div class="balloon" style="top: 8%; left: 3%; animation-delay: 0s;">🎈</div>
    <div class="balloon" style="top: 3%; right: 5%; animation-delay: 2s;">🎈</div>
    <div class="balloon" style="bottom: 25%; left: 5%; animation-delay: 4s;">🎈</div>

    <div class="balloon" style="top: 45%; left: 8%; animation-delay: 8s;">🎈</div>

    <div class="click-hearts" id="clickHearts"></div>

    <div class="content-wrapper">
        <div class="container">
            <div class="header-section">
                <h1 class="main-title">520</h1>
                <h2 class="subtitle">我爱你</h2>

            <div class="name-container">

            <div class="interactive-section">
                <div class="countdown-container">
                    <div class="countdown-item">
                        <div class="countdown-number" id="days">261</div>

                    <div class="countdown-item">

                <button class="like-button" id="likeBtn">
                    <span>💕</span>

                <p class="mobile-hint">点击屏幕可以飘出爱心哦~</p>

            <div class="music-section">

                <div class="music-player">
                    <div class="play-btn" id="playBtn">

                    <div class="song-info">
                        <div class="song-title">April Encounter</div>

    <div class="touch-indicator">
        <div class="touch-dot"></div>
        <div class="touch-dot"></div>
        <div class="touch-dot"></div>
    </div>

    <script>
        function createStars() {
            const container = document.getElementById('stars');
            const starCount = Math.floor(window.innerWidth * 0.3);
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                const size = Math.random() * 2.5 + 0.8;
                star.style.width = star.style.height = size + 'px';
                star.style.animationDelay = Math.random() * 2.5 + 's';
                star.style.animationDuration = (Math.random() * 1.5 + 1.5) + 's';
                container.appendChild(star);
            }
        }

        function createFloatingHearts() {
            const container = document.getElementById('floatingHearts');
            const hearts = ['💕', '💗', '💖', '💘', '💝'];
            const heartCount = Math.floor(window.innerWidth / 40);
            for (let i = 0; i < Math.min(heartCount, 12); i++) {
                const heart = document.createElement('div');
                heart.className = 'floating-heart';
                heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDelay = Math.random() * 10 + 's';
                heart.style.animationDuration = (Math.random() * 5 + 8) + 's';
                heart.style.fontSize = (Math.random() * 16 + 16) + 'px';
                container.appendChild(heart);
            }
        }

        function handleClick(e) {
            const container = document.getElementById('clickHearts');
            const hearts = ['💕', '💗', '💖', '💘', '💝', '💓', '💞'];
            const count = 4 + Math.floor(Math.random() * 4);
            
            for (let i = 0; i < count; i++) {
                const heart = document.createElement('div');
                heart.className = 'click-heart';
                heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = e.clientX + 'px';
                heart.style.top = e.clientY + 'px';
                heart.style.transform = `translate(-50%, -50%) rotate(${Math.random() * 360}deg)`;
                heart.style.fontSize = (Math.random() * 16 + 14) + 'px';
                heart.style.animationDelay = Math.random() * 0.25 + 's';
                heart.style.animationDuration = (Math.random() * 0.4 + 0.7) + 's';
                container.appendChild(heart);
                setTimeout(() => heart.remove(), 900);
            }
        }

        let likeCount = 1314;
        const likeBtn = document.getElementById('likeBtn');
        const likeCountEl = document.getElementById('likeCount');

        likeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            likeCount++;
            likeCountEl.textContent = likeCount;
            likeBtn.classList.add('liked');
            
            setTimeout(() => {
                const rect = likeBtn.getBoundingClientRect();
                const x = rect.left + rect.width / 2;
                const y = rect.top + rect.height / 2;
                
                for (let i = 0; i < 6; i++) {
                    const heart = document.createElement('div');
                    heart.className = 'cursor-heart';
                    heart.textContent = '💕';
                    heart.style.left = x + 'px';
                    heart.style.top = y + 'px';
                    heart.style.transform = `translate(-50%, -50%) rotate(${Math.random() * 360}deg)`;
                    document.body.appendChild(heart);
                    setTimeout(() => heart.remove(), 400);
                }
            }, 80);
        });

        let isPlaying = false;
        const playBtn = document.getElementById('playBtn');
        let audioElement = null;
        
        function initAudio() {
            audioElement = document.createElement('audio');
            audioElement.src = 'https://cdn.pixabay.com/audio/2022/05/18/audio_e18b53a705.mp3';
            audioElement.loop = true;
            audioElement.volume = 0.4;
            audioElement.preload = 'auto';
            document.body.appendChild(audioElement);
        }
        
        function playAudio() {
            if (audioElement) {
                audioElement.play().then(() => {
                    isPlaying = true;
                    playBtn.innerHTML = '<i>⏸</i>';
                }).catch(() => {});
            }
        }
        
        function pauseAudio() {
            if (audioElement) {
                audioElement.pause();
                isPlaying = false;
                playBtn.innerHTML = '<i>▶</i>';
            }
        }
        
        initAudio();
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => { playAudio(); }, 3000);
        });
        document.addEventListener('click', playAudio);
        document.addEventListener('touchstart', playAudio);
        
        playBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (isPlaying) { pauseAudio(); }
            else { playAudio(); }
        });

        const lyrics = [
            '在这个相遇的季节',
            '微风轻轻吹拂着你的发梢',
            '阳光洒在你的脸上',
            '我的心跳开始加速',
            '那一刻我知道',
            '你就是我一直在等待的人',
            '牵着你的手走过每一天',
            '这是我最幸福的时刻',
            '不管未来有多少风雨',
            '我都会陪在你身边',
            '爱你是我一生的承诺',
            '永远不会改变',
            '你的笑容是最美的风景',
            '你的声音是最动听的旋律',
            '让我们一起走过春夏秋冬',
            '直到永远永远'
        ];

        let lyricIndex = 0;
        let lyricInterval = null;

        function showLyric() {
            const container = document.getElementById('lyricsContainer');
            const positions = ['top', 'middle', 'bottom'];
            const position = positions[lyricIndex % 3];
            const lyric = lyrics[lyricIndex % lyrics.length];
            
            const lyricEl = document.createElement('div');
            lyricEl.className = `lyric-item ${position}`;
            lyricEl.textContent = lyric;
            container.appendChild(lyricEl);
            
            setTimeout(() => { lyricEl.remove(); }, 8000);
            lyricIndex++;
        }

        function startLyrics() {
            if (lyricInterval) return;
            showLyric();
            lyricInterval = setInterval(showLyric, 3500);
        }

        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => { startLyrics(); }, 4000);
        });

        function updateCountdown() {
            const startDate = new Date('2025-08-31');
            const now = new Date();
            const diff = now - startDate;
            
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            
            document.getElementById('days').textContent = days;
            document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
            document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
            document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');
        }

        const canvas = document.createElement('canvas');
        canvas.className = 'canvas-bg';
        canvas.id = 'heartCanvas';
        document.body.appendChild(canvas);
        
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        class Heart {
            constructor() { this.reset(); }
            
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 80;
                this.size = Math.random() * 10 + 5;
                this.speedY = Math.random() * 1.2 + 0.6;
                this.speedX = (Math.random() - 0.5) * 1.2;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.03;
                this.opacity = Math.random() * 0.4 + 0.25;
                this.wobble = Math.random() * Math.PI * 2;
                this.wobbleSpeed = Math.random() * 0.03 + 0.01;
            }
            
            update() {
                this.y -= this.speedY;
                this.x += Math.sin(this.wobble) * 0.3 + this.speedX;
                this.rotation += this.rotationSpeed;
                this.wobble += this.wobbleSpeed;
                if (this.y < -40) { this.reset(); }
            }
            
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.globalAlpha = this.opacity;
                
                const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, this.size);
                gradient.addColorStop(0, 'rgba(255, 209, 220, 0.85)');
                gradient.addColorStop(0.5, 'rgba(255, 143, 171, 0.65)');
                gradient.addColorStop(1, 'rgba(255, 107, 157, 0.45)');
                
                ctx.beginPath();
                const s = this.size;
                ctx.moveTo(0, s / 4);
                ctx.bezierCurveTo(-s / 2, -s / 2, -s, s / 4, 0, s);
                ctx.bezierCurveTo(s, s / 4, s / 2, -s / 2, 0, s / 4);
                ctx.fillStyle = gradient;
                ctx.fill();
                ctx.restore();
            }
        }
        
        const hearts = [];
        const heartCount = Math.floor(window.innerWidth / 30);
        for (let i = 0; i < Math.min(heartCount, 20); i++) {
            const heart = new Heart();
            heart.y = Math.random() * canvas.height;
            hearts.push(heart);
        }
        
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            hearts.forEach(heart => { heart.update(); heart.draw(); });
            requestAnimationFrame(animate);
        }
        
        document.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            hearts.forEach(heart => {
                const dx = touch.clientX - heart.x;
                const dy = touch.clientY - heart.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                if (distance < 100) {
                    const force = (100 - distance) / 100;
                    heart.x -= dx * force * 0.012;
                    heart.y -= dy * force * 0.012;
                }
            });
        });

        createStars();
        createFloatingHearts();
        updateCountdown();
        setInterval(updateCountdown, 1000);
        animate();
        
        document.addEventListener('click', handleClick);
        document.addEventListener('touchstart', handleClick);
    </script>
</body>
