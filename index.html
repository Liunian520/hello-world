<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>马钰涵 💕</title>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700&family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #ff6b9d;
            --secondary-color: #ff8fab;
            --accent-color: #ffd1dc;
            --text-color: #d63384;
            --glow-color: rgba(255, 107, 157, 0.6);
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #f5576c 75%, #ff9a9e 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Noto Serif SC', serif;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            text-align: center;
            z-index: 10;
            padding: 2rem;
            position: relative;
        }

        .canvas-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .main-title {
            font-size: 8rem;
            font-family: 'Ma Shan Zheng', cursive;
            background: linear-gradient(45deg, #ff6b9d, #ff8fab, #ffd1dc, #ff6b9d);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: textGlow 3s ease-in-out infinite, fadeInUp 1.5s ease-out;
            text-shadow: 0 0 40px rgba(255, 107, 157, 0.5);
            margin-bottom: 1rem;
            letter-spacing: 0.2em;
        }

        @keyframes textGlow {
            0%, 100% { background-position: 0% 50%; filter: brightness(1); }
            50% { background-position: 100% 50%; filter: brightness(1.2); }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .subtitle {
            font-size: 3rem;
            font-family: 'Ma Shan Zheng', cursive;
            color: white;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8),
                         0 0 40px rgba(255, 107, 157, 0.6);
            animation: fadeInUp 1.5s ease-out 0.3s both, pulse 2s ease-in-out infinite;
            margin-bottom: 2rem;
            letter-spacing: 0.3em;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .name-container {
            position: relative;
            display: inline-block;
            margin: 2rem 0;
            animation: fadeInUp 1.5s ease-out 0.6s both;
        }

        .name-text {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 6rem;
            background: linear-gradient(135deg, #ff6b9d, #ff8fab, #ffd1dc, #ff6b9d, #ff8fab);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: nameHeartbeat 1.5s ease-in-out infinite, textGlow 3s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(255, 107, 157, 0.5);
            letter-spacing: 0.15em;
            position: relative;
            z-index: 10;
            filter: drop-shadow(0 0 20px rgba(255, 107, 157, 0.6));
        }

        @keyframes nameHeartbeat {
            0%, 100% { 
                transform: scale(1);
                filter: drop-shadow(0 0 20px rgba(255, 107, 157, 0.6));
            }
            10% { 
                transform: scale(1.08);
                filter: drop-shadow(0 0 40px rgba(255, 107, 157, 0.9));
            }
            20% { 
                transform: scale(1);
                filter: drop-shadow(0 0 20px rgba(255, 107, 157, 0.6));
            }
            30% { 
                transform: scale(1.08);
                filter: drop-shadow(0 0 40px rgba(255, 107, 157, 0.9));
            }
            40% { 
                transform: scale(1);
                filter: drop-shadow(0 0 20px rgba(255, 107, 157, 0.6));
            }
        }

        .glow-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 200px;
            border: 3px solid rgba(255, 107, 157, 0.3);
            border-radius: 50%;
            animation: ripple 2s ease-out infinite;
        }

        .glow-ring:nth-child(2) {
            animation-delay: 0.5s;
        }

        .glow-ring:nth-child(3) {
            animation-delay: 1s;
        }

        @keyframes ripple {
            0% {
                transform: translate(-50%, -50%) scale(0.8);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(1.5);
                opacity: 0;
            }
        }

        .love-message {
            font-size: 1.3rem;
            color: white;
            line-height: 2.2;
            margin: 2rem 0;
            animation: fadeInUp 1.5s ease-out 0.9s both;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
            text-align: justify;
            padding: 0 1rem;
        }

        .love-message .intro {
            font-size: 1.5rem;
            color: #ffd1dc;
            font-weight: bold;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .love-message .content {
            margin: 1.5rem 0;
            opacity: 0;
            animation: fadeInUp 0.8s ease-out forwards;
        }

        .love-message .content:nth-child(2) { animation-delay: 1.2s; }
        .love-message .content:nth-child(3) { animation-delay: 1.5s; }
        .love-message .content:nth-child(4) { animation-delay: 1.8s; }

        .love-message .signature {
            margin-top: 3rem;
            text-align: right;
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 2rem;
            color: #ffd1dc;
            opacity: 0;
            animation: fadeInUp 1s ease-out 2.2s forwards, pulse 3s ease-in-out infinite 2.2s;
        }

        .decorative-line {
            width: 200px;
            height: 3px;
            background: linear-gradient(90deg, transparent, white, transparent);
            margin: 2rem auto;
            animation: fadeInUp 1.5s ease-out 1s both;
            position: relative;
        }

        .decorative-line::before,
        .decorative-line::after {
            content: '💕';
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.5rem;
        }

        .decorative-line::before { left: -30px; }
        .decorative-line::after { right: -30px; }

        .music-player {
            margin: 3rem auto;
            text-align: center;
            animation: fadeInUp 1.5s ease-out 2.5s both;
        }

        .music-label {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 1.5rem;
            color: #ffd1dc;
            margin-bottom: 1rem;
            text-shadow: 0 0 10px rgba(255, 107, 157, 0.5);
        }

        .music-label::before,
        .music-label::after {
            content: '🎵';
            margin: 0 0.5rem;
        }

        .music-iframe {
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3),
                        0 0 40px rgba(255, 107, 157, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .music-iframe:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 30px rgba(0, 0, 0, 0.4),
                        0 0 60px rgba(255, 107, 157, 0.4);
        }

        .footer-text {
            font-family: 'Dancing Script', cursive;
            font-size: 1.8rem;
            color: white;
            margin-top: 3rem;
            animation: fadeInUp 1.5s ease-out 2.1s both, twinkle 2s ease-in-out infinite;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
        }

        @keyframes twinkle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .sparkles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .sparkle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
            animation: sparkle 3s ease-in-out infinite;
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
        }

        .rose {
            position: fixed;
            font-size: 2rem;
            animation: floatRose 8s ease-in-out infinite;
            opacity: 0.7;
            z-index: 5;
        }

        .rose:nth-child(1) { top: 10%; left: 5%; animation-delay: 0s; }
        .rose:nth-child(2) { top: 20%; right: 8%; animation-delay: 1s; }
        .rose:nth-child(3) { bottom: 15%; left: 10%; animation-delay: 2s; }
        .rose:nth-child(4) { bottom: 25%; right: 5%; animation-delay: 3s; }

        @keyframes floatRose {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        .aurora {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 80%, rgba(255, 107, 157, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(118, 75, 162, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 40% 40%, rgba(240, 147, 251, 0.1) 0%, transparent 40%);
            animation: auroraShift 10s ease-in-out infinite;
            z-index: 0;
        }

        @keyframes auroraShift {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.1); }
        }

        .content-wrapper {
            position: relative;
            z-index: 10;
        }

        @media (max-width: 768px) {
            .main-title {
                font-size: 5rem;
            }
            
            .subtitle {
                font-size: 2rem;
            }
            
            .name-text {
                font-size: 4rem;
            }
            
            .glow-ring {
                width: 300px;
                height: 150px;
            }
            
            .love-message {
                font-size: 1.2rem;
                padding: 0 1rem;
            }
            
            .footer-text {
                font-size: 1.4rem;
            }
        }

        @media (max-width: 480px) {
            .main-title {
                font-size: 4rem;
            }
            
            .subtitle {
                font-size: 1.6rem;
                letter-spacing: 0.15em;
            }

            .name-text {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>
    <div class="aurora"></div>
    
    <canvas class="canvas-bg" id="heartCanvas"></canvas>
    
    <div class="sparkles" id="sparkles"></div>
    
    <div class="rose">🌹</div>
    <div class="rose">💐</div>
    <div class="rose">🌸</div>
    <div class="rose">🌺</div>
    
    <div class="content-wrapper">
        <div class="container">
            <h1 class="main-title">520</h1>
            <h2 class="subtitle">我爱你</h2>
            
            <div class="name-container">
                <div class="glow-ring"></div>
                <div class="glow-ring"></div>
                <div class="glow-ring"></div>
                <div class="name-text">马钰涵</div>
            </div>
            
            <div class="decorative-line"></div>
            
            <div class="love-message">
                <div class="intro">相识261天，一日夫妻百日恩</div>
                
                <div class="content">
                    不管怎么说我们也相识有261天啦，今天还是要给你安排一个表白。
                </div>
                
                <div class="content">
                    我还是非常喜欢你呢，尽管有很多的疑惑和不解。<br>
                    但我还是非常感谢你的喜欢，让我在内心深处自信了很多。
                </div>
                
                <div class="content">
                    我相信，我们还会在一起，一起做很多事情，<br>
                    一起度过恬静又美好的每一天。
                </div>
                
                <div class="signature">
                    致东北第一美人，马钰涵 💕
                </div>
            </div>
            
            <div class="music-player">
                <div class="music-label">April Encounter</div>
                <iframe class="music-iframe"
                    frameborder="no" 
                    border="0" 
                    marginwidth="0" 
                    marginheight="0" 
                    width="350" 
                    height="90"
                    src="https://music.163.com/outchain/player?type=2&id=551400874&auto=1&height=66">
                </iframe>
            </div>
            
            <p class="footer-text">Forever and Always 💕</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        class Heart {
            constructor() {
                this.reset();
            }
            
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 100;
                this.size = Math.random() * 15 + 8;
                this.speedY = Math.random() * 2 + 1;
                this.speedX = (Math.random() - 0.5) * 2;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.05;
                this.opacity = Math.random() * 0.6 + 0.4;
                this.wobble = Math.random() * Math.PI * 2;
                this.wobbleSpeed = Math.random() * 0.05 + 0.02;
            }
            
            update() {
                this.y -= this.speedY;
                this.x += Math.sin(this.wobble) * 0.5 + this.speedX;
                this.rotation += this.rotationSpeed;
                this.wobble += this.wobbleSpeed;
                
                if (this.y < -50) {
                    this.reset();
                }
            }
            
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.globalAlpha = this.opacity;
                
                ctx.beginPath();
                const s = this.size;
                ctx.moveTo(0, s / 4);
                ctx.bezierCurveTo(-s / 2, -s / 2, -s, s / 4, 0, s);
                ctx.bezierCurveTo(s, s / 4, s / 2, -s / 2, 0, s / 4);
                ctx.fillStyle = this.getHeartColor();
                ctx.fill();
                
                ctx.restore();
            }
            
            getHeartColor() {
                const colors = [
                    'rgba(255, 107, 157, 0.8)',
                    'rgba(255, 143, 171, 0.8)',
                    'rgba(255, 209, 220, 0.8)',
                    'rgba(214, 51, 132, 0.8)',
                    'rgba(248, 180, 217, 0.8)'
                ];
                return colors[Math.floor(Math.random() * colors.length)];
            }
        }
        
        const hearts = [];
        for (let i = 0; i < 30; i++) {
            const heart = new Heart();
            heart.y = Math.random() * canvas.height;
            hearts.push(heart);
        }
        
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            hearts.forEach(heart => {
                heart.update();
                heart.draw();
            });
            
            requestAnimationFrame(animate);
        }
        
        animate();
        
        function createSparkles() {
            const container = document.getElementById('sparkles');
            for (let i = 0; i < 20; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.style.left = Math.random() * 100 + '%';
                sparkle.style.top = Math.random() * 100 + '%';
                sparkle.style.animationDelay = Math.random() * 3 + 's';
                sparkle.style.animationDuration = (Math.random() * 2 + 2) + 's';
                container.appendChild(sparkle);
            }
        }
        
        createSparkles();
        
        document.addEventListener('mousemove', (e) => {
            hearts.forEach(heart => {
                const dx = e.clientX - heart.x;
                const dy = e.clientY - heart.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < 150) {
                    const force = (150 - distance) / 150;
                    heart.x -= dx * force * 0.02;
                    heart.y -= dy * force * 0.02;
                }
            });
        });
    </script>
</body>
</html>
